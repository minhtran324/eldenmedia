<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0284c7">
  <title>Mất kết nối | Elden Media</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#f0f7ff;color:#0f172a;font-family:system-ui,-apple-system,sans-serif;line-height:1.6}main{max-width:480px;width:100%;background:white;padding:32px;border:1px solid #dbeafe;border-radius:24px;box-shadow:0 16px 40px #0284c711}img{width:64px;height:64px;border-radius:16px}.brand{font-size:12px;font-weight:700;letter-spacing:2px;color:#0369a1}h1{font-size:28px;line-height:1.3;margin:16px 0}p{color:#475569}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}button,a{font:inherit;font-weight:600;padding:12px 18px;border-radius:10px;border:1px solid #bae6fd;text-decoration:none;cursor:pointer}button{color:white;background:#0284c7}a{color:#0369a1;background:white}button:focus-visible,a:focus-visible{outline:3px solid #0f172a;outline-offset:3px}.note{font-size:13px;margin-bottom:0}@media(max-width:360px){main{padding:24px}}
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="Elden Media" width="64" height="64">
    <p class="brand">ELDEN MEDIA</p>
    <h1>Chưa kết nối được với hệ thống</h1>
    <p>Kiểm tra Wi-Fi hoặc dữ liệu di động, rồi thử tải lại.</p>
    <p>Cần kết nối để xem số liệu mới, đăng ký lịch, nhận/trả máy và xác nhận check-in/out.</p>
    <div class="actions"><button type="button" onclick="window.location.reload()">Thử tải lại</button><a href="/home">Về trang chủ</a></div>
    <p class="note">Nếu vừa gửi thao tác trước khi mất mạng, kiểm tra trạng thái sau khi kết nối lại.</p>
  </main>
</body>
</html>
